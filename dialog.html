<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'unsafe-inline'; connect-src 'self' https://appsforoffice.microsoft.com https://*.microsoft.com https://*.office.com https://*.office.net; object-src 'none'; base-uri 'none';">
  <title>Відкриваю…</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js?v=1.9.1"></script>
</head>
<body style="font: 14px 'Segoe UI', system-ui, sans-serif; padding: 16px;">
  <div id="msg">Відкриваю сторінку… / Opening page…</div>
  <!--
    Діалог Office мусить спершу відкрити сторінку з домену надбудови,
    після чого може перейти на будь-який сайт. У вікні діалогу X-Frame-Options
    не заважає, бо сайт відкривається як окрема сторінка, а не в iframe.
    Логіка в dialog.js, щоб CSP не потребував 'unsafe-inline' для скриптів.
  -->
  <script src="dialog.js?v=1.9.1"></script>
</body>
</html>
